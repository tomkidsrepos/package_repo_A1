name: Build Repo Package

concurrency:
  group: build-packages
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest remote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }}

      - name: Generate Packages
        run: |
          rm -f Packages Packages.bz2
          dpkg-scanpackages -m . /dev/null > Packages
          bzip2 -fks Packages

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate Packages"
          file_pattern: "Packages Packages.bz2"
          push_options: "--force-with-lease"

      - name: Trigger Main Repo Sync
        if: success()
        run: |
          curl -X POST https://api.github.com/repos/tomkidsrepos/tomkidsrepos.github.io/dispatches \
          -H 'Accept: application/vnd.github.v3+json' \
          -H 'Authorization: token ${{ secrets.PAT_TOKEN }}' \
          -d '{"event_type": "trigger-sync"}'
